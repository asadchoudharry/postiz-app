name: "REKTRS Build Image"

# Builds the REKTRS Social production image (Dockerfile.rektrs) on GitHub
# runners and pushes it to GHCR. The production host only PULLS the finished
# image — builds never run on the shared host (2026-11-13 incident: an
# on-host build exhausted the shared server's RAM and took every site down).
# Triggers: manual dispatch (once registered) OR a push to the release
# branch that touches this file or Dockerfile.rektrs (push events use the
# default input values below via the || fallbacks).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. next16-f7b59d85)"
        required: true
        default: "next16-5ed8e1b6"
      source_revision:
        description: "Full source commit SHA stamped into the image (REKTRS_SOURCE_REVISION)"
        required: true
        default: "5ed8e1b69e713304d2f3b5211bddc300e5efac1b"
      app_version:
        description: "NEXT_PUBLIC_VERSION value"
        required: true
        default: "2.25.3-rektrs"
  push:
    branches:
      - release/rektrs-social-next16-2026-11-13
    paths:
      - ".github/workflows/rektrs-build-image.yml"
      - "Dockerfile.rektrs"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rektrs
          push: true
          tags: |
            ghcr.io/asadchoudharry/postiz-app:${{ inputs.image_tag || 'next16-5ed8e1b6' }}
            ghcr.io/asadchoudharry/postiz-app:next16-current
          build-args: |
            REKTRS_SOURCE_REVISION=${{ inputs.source_revision || '5ed8e1b69e713304d2f3b5211bddc300e5efac1b' }}
            NEXT_PUBLIC_VERSION=${{ inputs.app_version || '2.25.3-rektrs' }}
            NEXT_PUBLIC_REKTRS_SOCIAL_BRAND=true
            NEXT_PUBLIC_REKTRS_CONTENT_REVIEW=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Dokploy (auto-deploy)
        if: success()
        run: |
          if [ -n "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}" || echo "::warning::Dokploy deploy webhook call failed"
          else
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK secret is not set"
          fi
# trigger: W3 build (b79fc9f7)
