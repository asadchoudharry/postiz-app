name: "REKTRS Build Image"

# Builds the REKTRS Social production image (Dockerfile.rektrs) on GitHub
# runners and pushes it to GHCR. The production host only PULLS the finished
# image — builds never run on the shared host (2026-11-13 incident: an
# on-host build exhausted the shared server's RAM and took every site down).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. next16-f7b59d85)"
        required: true
        default: "next16-f7b59d85"
      source_revision:
        description: "Full source commit SHA stamped into the image (REKTRS_SOURCE_REVISION)"
        required: true
        default: "f7b59d85a27421096fe4246f07e232aae09c46bd"
      app_version:
        description: "NEXT_PUBLIC_VERSION value"
        required: true
        default: "2.25.3-rektrs"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rektrs
          push: true
          tags: ghcr.io/asadchoudharry/postiz-app:${{ inputs.image_tag }}
          build-args: |
            REKTRS_SOURCE_REVISION=${{ inputs.source_revision }}
            NEXT_PUBLIC_VERSION=${{ inputs.app_version }}
            NEXT_PUBLIC_REKTRS_SOCIAL_BRAND=true
            NEXT_PUBLIC_REKTRS_CONTENT_REVIEW=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
