name: REKTRS Social preflight

on:
  pull_request:
    paths:
      - 'scripts/rektrs-social-preflight*.mjs'
      - '.github/workflows/rektrs-social-preflight.yml'
  workflow_dispatch:
    inputs:
      check_live:
        description: 'Run unauthenticated read-only HTTPS checks against public REKTRS endpoints'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/rektrs-social-preflight.mjs
      - name: Test
        run: node --test scripts/rektrs-social-preflight.test.mjs

  public-readiness:
    name: Public endpoint readiness (manual opt-in)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.check_live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTTPS public pages and app sign-in
        run: node scripts/rektrs-social-preflight.mjs
